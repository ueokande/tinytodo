<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク追加の配置案</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; background: #e9ece9; color: #24352b; font-family: system-ui, sans-serif; }
    h1 { margin: 0 0 32px; font-size: 24px; }
    .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; max-width: 1100px; }
    h2 { font-size: 17px; margin: 0 0 14px; }
    .phone { height: 460px; background: #f7f8f6; border: 1px solid #ccd4ce; border-radius: 20px; padding: 24px 16px; position: relative; overflow: hidden; }
    header { font-size: 20px; font-weight: 650; margin-bottom: 24px; }
    .entry { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; background: white; border: 1px solid #cddbd1; border-radius: 8px; margin-bottom: 16px; }
    .placeholder { flex: 1; color: #88968c; font-size: 14px; }
    .submit { padding: 9px 12px; background: #426a50; color: white; border-radius: 5px; font-size: 13px; }
    .task { display: flex; align-items: center; gap: 12px; height: 58px; border-bottom: 1px solid #edf0ed; background: white; padding: 12px; font-size: 15px; }
    .circle { width: 22px; height: 22px; border: 1px solid #bfcec3; border-radius: 50%; }
    .bottom { position: absolute; left: 16px; right: 16px; bottom: 16px; margin: 0; }
    .inline { color: #6c8172; background: transparent; gap: 14px; }
    .inline span { font-size: 25px; }
    p { font-size: 13px; line-height: 1.8; margin: 16px 0 0; color: #52695b; }
    @media(max-width: 850px) { body { padding: 24px; } .options { grid-template-columns: 1fr; max-width: 360px; } }
  </style>
</head>
<body>
  <h1>タスク追加の配置案</h1>
  <div class="options">
    <section>
      <h2>A — 上部の入力欄</h2>
      <div class="phone" aria-label="上部入力欄のイメージ">
        <header>マイリスト</header>
        <div class="entry"><span class="placeholder">追加</span><span class="submit">追加</span></div>
        <div class="task"><span class="circle"></span>牛乳</div>
        <div class="task"><span class="circle"></span>パン</div>
        <div class="task"><span class="circle"></span>電池</div>
      </div>
      <p>開いてすぐ入力。追加後も入力を続けられるので、買うものをまとめて登録しやすい。現在の実装。</p>
    </section>
    <section>
      <h2>B — 下部の固定入力欄</h2>
      <div class="phone" aria-label="下部固定入力欄のイメージ">
        <header>マイリスト</header>
        <div class="task"><span class="circle"></span>牛乳</div>
        <div class="task"><span class="circle"></span>パン</div>
        <div class="task"><span class="circle"></span>電池</div>
        <div class="entry bottom"><span class="placeholder">追加</span><span class="submit">↑</span></div>
      </div>
      <p>親指が届く位置に常設。長いリストでも追加しやすい。キーボード表示中は入力欄をその上に配置する想定。</p>
    </section>
    <section>
      <h2>C — リスト末尾の追加行</h2>
      <div class="phone" aria-label="末尾追加行のイメージ">
        <header>マイリスト</header>
        <div class="task"><span class="circle"></span>牛乳</div>
        <div class="task"><span class="circle"></span>パン</div>
        <div class="task"><span class="circle"></span>電池</div>
        <div class="task inline"><span>＋</span>追加</div>
      </div>
      <p>押すとその行が入力欄に切り替わる。ノートに書き足す感覚。画面は最も静かだが、長いリストでは末尾まで移動が必要。</p>
    </section>
  </div>
</body>
</html>
